<script src="https://www.meine-mensa.de/js/yummy.js?id=e1699f3ba93b5a66321d6ef9ffc07c8c"></script>
    <script type="text/javascript">
        $(document).ready(function () {
            $('#datetimepicker1').datetimepicker({
                locale: 'de',
                format: 'DD.MM.YYYY',
                defaultDate: '2026-10-27',
                allowInputToggle: true
            });
            $('#datetimepicker1').on('change.datetimepicker', function (e) {
                display();
            });

            $('#location_id').on('hidden.bs.select', function (e) {
                display();
            });
            $('#todayButton').click(function () {
                $('#food_date').val('27.10.2026')
                display();
            });
            $('#tomorrowButton').click(function () {
                $('#food_date').val('28.10.2026')
                display();
            });
            $('#displayButton').click(function () {
                display();
            });
                        enableLW();

        })
        ;

        function enableLW() {
            $('button.yummy-button').click(function () {
                url = 'https://www.meine-mensa.de/yummy/go';
                data = new Object();
                data.food_id = $(this).data('food_id');
                data.query = 'addFoodToSession';
                $.ajax({
                    method: "POST",
                    url: url,
                    data: data,
                    headers: {
                        'X-CSRF-TOKEN': 'TEST-CSRF-TOKEN'
                    }
                }).done(function (response) {
                    self.location = 'https://www.meine-mensa.de/yummy';
                });
            });
        }

        function display() {
            if ($('#location_id').val() != null) {
                url = 'https://www.meine-mensa.de/yummy/go';
                $.ajax({
                    method: "POST",
                    url: url,
                    headers: {
                        'X-CSRF-TOKEN': 'TEST-CSRF-TOKEN'
                    },
                    data: {'date': $('#food_date').val(), 'location_ids': $('#location_id').val(), 'query': 'foodplan'}
                }).done(function (response) {
                    if (response.length != 0) {
                        $('#ajax_content').html(response)
                    } else {
                        $('#ajax_content').html('')
                    }
                    enableLW();
                })
            } else {

            }
        }

    </script>
